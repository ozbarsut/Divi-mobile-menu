<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RUBO Logo Preview</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #111;
      display: grid;
      place-items: center;
    }
    .frame {
      width: 1100px;
      height: 310px;
      background: #fff;
      display: grid;
      place-items: center;
    }
    img {
      width: 1100px;
      height: 310px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="frame">
    <img src="rubo-rent-a-car.svg" alt="RUBO Rent A Car logo" />
  </div>
</body>
</html>
