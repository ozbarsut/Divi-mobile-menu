<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RUBO Logo Preview</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #050505;
      display: grid;
      place-items: center;
      font-family: Helvetica, Arial, sans-serif;
      color: #9bb7e0;
    }
    .wrap {
      display: grid;
      gap: 24px;
      justify-items: center;
      padding: 40px 20px;
    }
    img {
      width: min(960px, 92vw);
      height: auto;
      display: block;
    }
    p { margin: 0; letter-spacing: 0.08em; font-size: 13px; }
  </style>
</head>
<body>
  <div class="wrap">
    <img src="rubo-rent-a-car.svg" alt="RUBO Rent A Car logo" />
    <p>RUBO logo preview</p>
  </div>
</body>
</html>
